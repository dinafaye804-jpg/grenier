  if(p1==='share'){const t=txt.replace(/\*/g,'');if(navigator.share)navigator.share({text:t}).then(()=>{v.demande=today();save()}).catch(()=>{});else{$('#sheet').innerHTML='<div class="grab"></div><h3>Message pour le client</h3><p style="font-size:14px;color:var(--gris);margin:4px 0 10px">Copiez le message et collez-le dans votre application SMS.</p><textarea id="tc" readonly style="width:100%;height:260px;font:14px Arial,sans-serif;border:1.5px solid var(--trait);border-radius:12px;padding:10px">'+esc(t)+'</textarea><div class="btns"><button class="btn" data-a="codecopy">📋 Copier</button><button class="btn sec" data-a="close">Fermer</button></div>';$('#veil').classList.add('on')}return}
  if(!tel){toast('Saisissez le téléphone du client');const i=document.querySelector('[data-v=ctel]');if(i)i.focus();return}
  if(p1==='wa'){const u='https://wa.me/'+tel+'?text='+encodeURIComponent(txt);if(!window.open(u,'_blank'))location.href=u}
  else if(p1==='sms')location.href=smsHref(v);
  v.demande=today();save()}
 else if(a==='wpay')wPay(p1);
 else if(a==='wcopy'){const v=p1==='t'?$('#wt').value.replace(/\s/g,''):String(num($('#wm').value)),ok=()=>toast((p1==='t'?'Numéro':'Montant')+' copié : '+v);
  if(!v||v==='0'){toast(p1==='t'?'Saisissez le numéro':'Saisissez le montant');return}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,()=>toast(v));else toast(v)}
 else if(a==='wdone'){const m=M(p1),mt=num($('#wm').value),tel=$('#wt').value.trim();
  if(mt<=0){toast('Saisissez le montant');return}
  if(tel&&tel!==m.tel)m.tel=tel;
  S.paiements.push({id:uid(),date:today(),m:p1,montant:mt,mode:'Wave'});save();closeSheet();toast('Paiement de '+F(mt)+' enregistré ✓');render()}
 else if(a==='cp'){const v=b.dataset.v,ok=()=>toast('Copié : '+v);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,()=>toast(v));else toast(v)}
 else if(a==='licact'){const n=$('#ln').value.trim(),c=licCheck(n,$('#lk').value);
  if(!c.ok){$('#lerr').textContent='Clé non valable pour ce nom. Vérifiez le nom exact et la clé.';return}
  if(c.expire){$('#lerr').textContent='Cette clé a expiré le '+fd(c.fin)+'.';return}
  S.params.nom=n;S.licence={cle:c.key,date:today()};save();toast('Licence activée ✓');go('home')}
 else if(a==='codeout')codeOut();
 else if(a==='codein')codeIn();
 else if(a==='codesync')codeMerge();
 else if(a==='codemerge'){readCode($('#tc').value).then(d=>{if(d._app&&d._app===app()){$('#err').textContent='Ce code vient d\'un appareil qui porte aussi la lettre '+app()+'. Donnez une lettre différente à chaque appareil (Réglages › Plusieurs appareils), puis recommencez.';return}
  if(normNom(d.params&&d.params.nom)!==normNom(S.params.nom)){$('#err').textContent='Ce code vient d\'une autre coopérative ('+(d.params&&d.params.nom||'?')+').';return}
  const r=fusion(d);$('#sheet').innerHTML='<div class="grab"></div><h3>Synchronisation terminée ✓</h3><div class="card" style="padding:4px 14px;margin:12px 0"><div class="row"><div class="g">Ajoutés</div><b>'+r.add+'</b></div><div class="row"><div class="g">Mis à jour</div><b>'+r.upd+'</b></div><div class="row"><div class="g">Supprimés</div><b>'+r.rm+'</b></div></div><p style="font-size:14px;color:var(--gris)">Pour que l\'autre appareil reçoive aussi vos saisies, envoyez-lui maintenant votre code.</p><div class="btns"><button class="btn" data-a="codeout">📤 Envoyer mon code</button><button class="btn sec" data-a="close">Fermer</button></div>';render()})
  .catch(()=>{$('#err').textContent='Code non reconnu ou incomplet'})}
 else if(a==='setapp'){try{localStorage.setItem('grenier_appareil',p1)}catch(e){}toast('Cet appareil : '+p1);render()}
 else if(a==='codecopy'){const t=$('#tc'),ok=()=>toast('Code copié ✓'),fb=()=>{t.focus();t.select();t.setSelectionRange(0,t.value.length);try{document.execCommand('copy')?ok():toast('Sélectionnez puis copiez le code')}catch(e){toast('Sélectionnez puis copiez le code')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,fb);else fb()}
 else if(a==='codeshare')navigator.share({title:'Code de transfert – '+S.params.nom,text:$('#tc').value}).catch(()=>{});
 else if(a==='del'||a==='reset'||a==='delprod'||a==='nocode'||a==='codeload'){
  if(!b.classList.contains('sure')){b.classList.add('sure');b.dataset.o=b.textContent;b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){b.classList.remove('sure');b.textContent=b.dataset.o}},3000);return}
  if(a==='codeload'){readCode($('#tc').value).then(d=>{delete d._app;S=Object.assign(empty(),d);numeros();snap();save();closeSheet();toast('Données importées ✓');go('home')}).catch(()=>{$('#err').textContent='Code non reconnu ou incomplet';b.classList.remove('sure');b.textContent='Importer'});return}
  if(a==='nocode'){S.params.code='';save();toast('Code supprimé');render();return}
  if(a==='reset'){const keep={licence:S.licence,essai:S.essai,nom:S.licence?S.params.nom:null};S=empty();if(keep.licence){S.licence=keep.licence;S.params.nom=keep.nom}S.essai=keep.essai;snap();save();toast('Prêt pour vos données');go('params');return}
  if(a==='delprod'){const pr=S.params.produits[+p1];if(S.pesees.some(x=>x.produit===pr.n)||S.ventes.some(v=>v.lignes.some(l=>l.produit===pr.n))||S.ajust.some(x=>x.produit===pr.n)){toast('Produit déjà utilisé');render();return}S.params.produits.splice(+p1,1);save();render();return}
  if(p1==='membres'){if(USED(p2)){toast('Impossible : ce membre a des opérations');render();return}S.membres=S.membres.filter(x=>x.id!==p2);tomb(p2);save();go('membres');return}
  S[p1]=S[p1].filter(x=>x.id!==p2);tomb(p2);
  if(p1==='credits'){tomb(...S.rembs.filter(x=>x.c===p2).map(x=>x.id));S.rembs=S.rembs.filter(x=>x.c!==p2)}
  if(p1==='ventes'){tomb(...S.encs.filter(x=>x.v===p2).map(x=>x.id));S.encs=S.encs.filter(x=>x.v!==p2)}
  if(p1==='emprunts'){tomb(...S.rembE.filter(x=>x.e===p2).map(x=>x.id));S.rembE=S.rembE.filter(x=>x.e!==p2)}
  save();toast('Supprimé');render()}
 else if(a==='addprod'){S.params.produits.push({n:'Nouveau produit',prix:0,seuil:0});save();render()}
 else if(a==='export'){dl('sauvegarde_cooperative_'+today()+'.json','application/json',JSON.stringify(S));toast('Sauvegarde créée')}
 else if(a==='import')$('#imp').click();
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.p){const k=t.dataset.p;if(k==='nom'&&licStat().mode==='licence'){t.value=S.params.nom;return}if(k==='waveLink'&&t.value.trim()&&!okLink(t.value.trim())){toast('Le lien doit commencer par https://');t.value=S.params.waveLink||'';return}
  S.params[k]=(k==='part'||k==='tare'||k==='tauxCredit')?num(t.value):t.value.trim();save();if(k==='nom')$('#hsub').textContent=S.params.nom}
 else if(t.dataset.v){const v=S.ventes.find(x=>x.id===arg);if(!v)return;const val=t.value.trim();
  if(t.dataset.v==='lien'&&val&&!okLink(val)){toast('Le lien doit commencer par https://');t.value=v.lien||'';return}
  v[t.dataset.v]=val;save();toast('Enregistré ✓');render()}
 else if(t.dataset.init){S.params.init[t.dataset.init]=num(t.value);save()}
 else if(t.dataset.pr){const [i,k]=t.dataset.pr.split(':'),pr=S.params.produits[+i];
  if(k==='n'){const nv=t.value.trim();if(!nv||S.params.produits.some((x,j)=>j!==+i&&x.n===nv)){toast('Nom déjà utilisé ou vide');t.value=pr.n;return}
   S.pesees.forEach(x=>{if(x.produit===pr.n)x.produit=nv});S.ventes.forEach(v=>v.lignes.forEach(l=>{if(l.produit===pr.n)l.produit=nv}));S.ajust.forEach(x=>{if(x.produit===pr.n)x.produit=nv});pr.n=nv}
  else pr[k]=num(t.value);save()}
 else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.params||!Array.isArray(d.membres))throw 0;delete d._app;S=Object.assign(empty(),d);numeros();snap();save();toast('Données restaurées');go('home')}catch(x){toast('Fichier non reconnu')}};r.readAsText(t.files[0]);t.value=''}
});
load();S.params.code?lock():render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(reg=>{
 reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nouvelle version prête : fermez et rouvrez l\'application')})})}).catch(()=>{})}
</script>
